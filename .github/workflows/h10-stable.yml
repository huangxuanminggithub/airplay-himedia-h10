name: Build H10 stable APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h10-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SIGNER_SHA256: ce16788cfe8269ca2fb0d4edf5d6f2863c61ca152694528ea6c5667316dac17b
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install pinned Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ninja-build perl curl unzip python3
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          tools_archive="$RUNNER_TEMP/commandlinetools.zip"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            --output "$tools_archive"
          printf '%s  %s\n' 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583 "$tools_archive" | sha256sum --check
          unzip -q "$tools_archive" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' 'build-tools;36.0.0' \
            'ndk;27.0.12077973' 'cmake;3.22.1'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          python3 tools/check-localization.py

      - name: Restore the H10 debug signing key
        env:
          H10_DEBUG_KEYSTORE_BASE64: ${{ secrets.H10_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$H10_DEBUG_KEYSTORE_BASE64" || { echo 'Missing H10_DEBUG_KEYSTORE_BASE64 repository secret'; exit 1; }
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$H10_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build the validated H10 variant
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          ./gradlew assembleMvpH10Display60 --no-daemon --console=plain --max-workers=2

      - name: Run native regression tests
        shell: bash
        run: bash tools/test-mvp.sh host

      - name: Verify and prepare the APK artifact
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          "$tools_dir/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out dist/airplay-h10-stable.apk \
            app/build/outputs/apk/mvpH10Display60/app-mvpH10Display60.apk
          "$tools_dir/aapt" dump badging dist/airplay-h10-stable.apk > dist/apk-metadata.txt
          grep -F "package: name='io.github.jqssun.airplay.mvph10display60' versionCode='32' versionName='0.0.31-mvp3-l10n1-h10display60v2'" dist/apk-metadata.txt
          grep -F "application-label:'客厅影院投屏'" dist/apk-metadata.txt
          grep -F "sdkVersion:'24'" dist/apk-metadata.txt
          if ! "$tools_dir/apksigner" verify --verbose --print-certs dist/airplay-h10-stable.apk > dist/signature.txt 2>&1; then
            cat dist/signature.txt
            exit 1
          fi
          cat dist/signature.txt
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" dist/signature.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/airplay-h10-stable.apk') as apk:
              libs = [name for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')]
              assert 'lib/armeabi-v7a/libairplay_native.so' in libs, libs
              assert all(name.startswith('lib/armeabi-v7a/') for name in libs), libs
          print('PASS: H10 native libraries use armeabi-v7a only')
          PY
          git rev-parse HEAD > dist/source-commit.txt
          (cd dist && sha256sum airplay-h10-stable.apk > SHA256SUMS)
          cat dist/SHA256SUMS
          {
            echo '## H10 stable APK'
            echo '- Variant: mvpH10Display60 / h10display60v2'
            echo '- Package: io.github.jqssun.airplay.mvph10display60'
            echo '- Native architecture: armeabi-v7a / Android 7+'
            echo '- Signing certificate matches the existing H10 installation.'
            echo '- Chinese resources and native regression tests passed.'
            echo '- Download the APK from the airplay-h10-stable artifact below.'
            echo '- Compilation does not re-run on-device mirroring or latency acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK, checksum and verification records
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: airplay-h10-stable
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload verification diagnostics on failure
        if: failure() && steps.verify_apk.outcome == 'failure'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: h10-verification-diagnostics
          path: dist/*.txt
          if-no-files-found: warn

      - name: Remove restored signing key
        if: always()
        shell: bash
        run: rm -f -- "$HOME/.android/debug.keystore"
